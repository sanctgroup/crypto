[package]
name = "pgp"
version = "0.21.0"
publish = false
authors = ["dignifiedquire <dignifiedquire@gmail.com>"]
description = "OpenPGP implementation in Rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/rpgp/rpgp"
repository = "https://github.com/rpgp/rpgp"
readme = "README.md"
resolver = "2"

keywords = ["pgp", "gpg", "openpgp", "email", "encryption"]
categories = ["cryptography", "email"]

exclude = ["tests/tests/*"]

edition = "2021"
rust-version = "1.88"

[lib]
name = "pgp"
bench = false

[dependencies]

base64 = ">=0.21.7, < 0.23"
buffer-redux = { version = "1.0.0", default-features = false }
bitfields = "1.0.0"
bytes = "1.11.1"
byteorder = "1.4"
derive_builder = "0.20.0"
hex = "0.4"
nom = "8.0"
log = "0.4.22"
smallvec = "1.10.0"
derive_more = { version = "2.0.1", features = ["debug", "display"] }
memchr = "2.8"
snafu = { version = "0.9.0", features = ["rust_1_81"] }

flate2 = { version = "1.1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = { version = "0.6.0", optional = true }

aes = "0.8.4"
aead = { version = "0.5", features = ["bytes"] }
argon2 = { version = "0.5", features = ["zeroize", "std"] }
block-padding = "0.3"
blowfish = "0.9"
camellia = "0.1"
cast5 = "0.11"
cfb-mode = "0.8.2"
cipher = "0.4.2"
const-oid = "0.9.6"
crc24 = "0.1.6"
curve25519-dalek = { version = "4.1.3", default-features = false, features = [
    "alloc",
    "precomputed-tables",
    "zeroize",
] }
des = "0.8"
digest = "0.10.7"
dsa = "0.6.3"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize", "fast", "rand_core"] }
generic-array = "0.14.6"
idea = "0.5"
md-5 = { version = "0.10.5", features = ["oid"] }
num_enum = { version = ">=0.5.7, < 0.8", default-features = false }
num-traits = "0.2.19"
rand = "0.8.6"
ripemd = { version = "0.1.3", features = ["oid"] }
sha1 = { version = "0.10.6", features = ["oid"] }
sha1-checked = { version = "0.10", features = ["zeroize"] }
sha2 = { version = "0.10.6", features = ["oid"] }
sha3 = { version = "0.10.8", features = ["oid"] }
signature = "2.2"
subtle = "2.6.1"
twofish = "0.7"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
getrandom = { version = "0.2", optional = true }
hkdf = "0.12.4"
aes-gcm = "0.10.3"
eax = "0.5.0"
ocb3 = "0.1"
aes-kw = { version = "0.2.1", features = ["std"] }
num-bigint = { version = "0.8.6", features = [
    "rand",
    "i128",
    "u64_digit",
    "prime",
    "zeroize",
], package = "num-bigint-dig" }
x25519-dalek = { version = "2.0.1", default-features = false, features = [
    "alloc",
    "precomputed-tables",
    "zeroize",
    "static_secrets",
] }

replace_with = "0.1.8"

web-time = { version = "1.1", optional = true }


[features]
default = ["bzip2"]
bzip2 = ["dep:bzip2"]
asm = ["sha2/asm", "md-5/asm"]
wasm = ["getrandom", "getrandom/js", "web-time"]
malformed-artifact-compat = []
draft-wussler-openpgp-forwarding = []
