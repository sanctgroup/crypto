name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release, without a leading v'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - id: parse
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION" --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Ensure tag is unused
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          refs=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [[ -n "$refs" ]]; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi

  build-wasm:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Set release version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          cargo update --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - run: ./scripts/build-wasm.sh
      - run: npm run test:wasm
      - run: npm run test:js
      - name: Package release
        run: |
          tar -czf sanct-crypto-wasm.tar.gz -C wasm .
          tar -czf sanct-crypto-metadata.tar.gz Cargo.lock package.json crates/sanct-crypto/Cargo.toml crates/sanct-wasm/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release
          path: |
            sanct-crypto-wasm.tar.gz
            sanct-crypto-metadata.tar.gz
          retention-days: 1

  release:
    needs: [validate, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release
          path: ./_artifacts
      - name: Restore verified release files
        run: |
          tar -xzf ./_artifacts/sanct-crypto-metadata.tar.gz
          rm -rf wasm
          mkdir wasm
          tar -xzf ./_artifacts/sanct-crypto-wasm.tar.gz -C wasm
      - name: Commit, tag, push
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/sanct-crypto/Cargo.toml crates/sanct-wasm/Cargo.toml package.json wasm
          if ! git diff --cached --quiet; then
            git commit -m "release: $TAG"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes ./_artifacts/sanct-crypto-wasm.tar.gz
