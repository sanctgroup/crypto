[workspace]
resolver = "2"
exclude = ["vendor/pgp"]
members = [
    "crates/sanct-crypto",
    "crates/sanct-wasm",
]

[workspace.dependencies]
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
ml-kem = { version = "0.3.3", features = ["zeroize", "getrandom"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
subtle = "2"
hmac = "0.13"
argon2 = { version = "0.6", features = ["zeroize"] }
rand = "0.8.8"
getrandom = { version = "0.4", features = ["wasm_js"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pgp = { path = "vendor/pgp", version = "=0.21.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
smallvec = "1"

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[profile.release]
lto = true
codegen-units = 1
